spring:
  application:
    name: yu-ai-agent

  profiles:
    active: local


  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        max-document-batch-size: 10000

server:
  port: 8123
  servlet:
    context-path: /api


  # springdoc-openapi??????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.tripo.yuaiagent.controller
  # knife4j???????????????
  knife4j:
    enable: true
    setting:
      language: zh_cn

  # searchAPI
search-api:
  api-key: 5o4Hq9RFqkGHyom2GhzzMXpx

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG







